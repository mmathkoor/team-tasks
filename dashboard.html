<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المعلومات - مهام الفريق</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0e2144">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');

:root {
  --bg: #f3f4f6;
  --card: #ffffff;
  --ink: #1f2937;
  --mute: #6b7280;
  --line: #e5e7eb;
  --acc: #3b82f6;
  --gold: #f59e0b;
  --goldlt: #fcd34d;
  --col: #f3f4f6;
  --late: #ef4444;
  --latesoft: #fee2e2;
  --soon: #f59e0b;
  --soonsoft: #fef3c7;
  --ok: #10b981;
  --oksoft: #d1fae5;
  --doing: #3b82f6;
  --doingsoft: #dbeafe;
  --todo: #9ca3af;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --radius: 16px;
  --radius-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --ink: #f8fafc;
    --mute: #94a3b8;
    --line: #334155;
    --acc: #3b82f6;
    --col: #0f172a;
    --latesoft: #451a1a;
    --soonsoft: #45321a;
    --oksoft: #064e3b;
    --doingsoft: #1e3a8a;
  }
}
* { box-sizing: border-box; font-family: 'Cairo', system-ui, -apple-system, sans-serif; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.6; }
main { max-width: 1200px; margin: auto; padding: 24px 16px 80px; }

/* Header */
.top {
  background: var(--card);
  color: var(--ink);
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
}
.top::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, var(--acc), #8b5cf6);
}
.top h1 { margin: 0; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.top .m { color: var(--mute); font-size: 14px; font-weight: 600; margin-top: 4px; }
.top-actions { display: flex; gap: 12px; }

a.btn, button, select {
  font: inherit;
  color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 10px 16px;
  cursor: pointer;
  font-weight: 700;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
}
a.btn:hover, button:hover, select:hover {
  background: var(--col);
  border-color: var(--mute);
}
.btn-primary { background: var(--acc) !important; color: white !important; border-color: var(--acc) !important; }
.btn-primary:hover { opacity: 0.9; }

.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
.bar .sp { flex: 1; }
.bar select { min-width: 200px; }
.m { font-size: 13.5px; color: var(--mute); }

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card:hover {
  box-shadow: var(--shadow-lg);
}
.card h2 { margin: 0 0 20px; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }

/* KPIs */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.kpi b { display: block; font-size: 36px; line-height: 1.1; font-weight: 800; margin-bottom: 4px; }
.kpi span { font-size: 14px; color: var(--mute); font-weight: 700; }
.kpi.ok b { color: var(--ok); }
.kpi.doing b { color: var(--doing); }
.kpi.late b { color: var(--late); }
.kpi.soon b { color: var(--soon); }
.kpi.todo b { color: var(--todo); }

.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 24px; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

/* Charts */
.donutwrap { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; justify-content: center; }
.donutwrap svg { width: 160px; height: 160px; flex: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
.leg { display: flex; flex-direction: column; gap: 12px; font-weight: 600; font-size: 14px; }
.leg span { display: flex; align-items: center; }
.leg i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-inline-end: 10px; }

/* Rows */
.row { margin-bottom: 18px; }
.row:last-child { margin-bottom: 0; }
.rh { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.stack { display: flex; height: 12px; border-radius: 8px; overflow: hidden; background: var(--col); box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
.stack i { display: block; height: 100%; transition: width 0.5s ease; }

/* Lists */
.li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.li:last-of-type { border-bottom: 0; padding-bottom: 0; }
.li:first-of-type { padding-top: 0; }
.li-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
.li-sub { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--mute); font-weight: 600; }
.chip {
  font-size: 12px;
  border-radius: 20px;
  padding: 4px 12px;
  font-weight: 700;
  white-space: nowrap;
  background: var(--col);
  border: 1px solid var(--line);
}
.chip.late { background: var(--latesoft); color: var(--late); border-color: rgba(239, 68, 68, 0.2); }
.chip.soon { background: var(--soonsoft); color: var(--soon); border-color: rgba(245, 158, 11, 0.2); }
.chip.ok { background: var(--oksoft); color: var(--ok); border-color: rgba(16, 185, 129, 0.2); }

.empty { text-align: center; color: var(--mute); padding: 32px 0; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty-icon { font-size: 32px; opacity: 0.5; }

#msg { text-align: center; padding: 80px 16px; font-size: 18px; font-weight: 600; color: var(--mute); }

</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>لوحة المعلومات</h1><div class="m" id="who"></div></div>
    <div style="display:flex;gap:8px"><button id="rf">🔄 تحديث</button><a class="btn" href="/">← المهام</a></div>
  </div>
  <div id="msg" class="card m">جارٍ تحميل البيانات...</div>
  <div id="dash" hidden></div>
</main>
<script>
const URL_ = 'https://wrmpyywosathqxrjuicx.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndybXB5eXdvc2F0aHF4cmp1aWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDg2NDQsImV4cCI6MjEwNzQ4NDY0NH0.CoSwCocuTVWlVU6QBNpp_bZiuykVkMHSHpT11KC1uvU';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
const today = () => new Date().toISOString().slice(0, 10);
const daysTo = d => Math.round((new Date(d) - new Date(today())) / 864e5);
const D = { members: [], tasks: [], done: [], meetings: [], props: [] };
let F = '', session = null;
try { session = JSON.parse(localStorage.getItem('sbs') || 'null'); } catch (e) {}

function stop(text) {
  $('dash').hidden = true; $('msg').hidden = false;
  $('msg').innerHTML = esc(text) + '<br><br><a class="btn" href="/">العودة إلى التطبيق</a>';
}
async function get(table, query) {
  const r = await fetch(URL_ + '/rest/v1/' + table + '?' + query, { headers: { apikey: KEY, Authorization: 'Bearer ' + session.access_token } });
  if (!r.ok) throw new Error(table);
  return r.json();
}
async function load() {
  if (!session || !session.access_token) return location.replace('/');
  // لا نجدد الجلسة هنا؛ التطبيق الرئيسي هو المسؤول عن تجديدها
  if (session.expires_at && session.expires_at - 30 < Date.now() / 1000) return stop('انتهت صلاحية الجلسة. افتح التطبيق الرئيسي مرة واحدة ثم ارجع إلى هذه الصفحة.');
  try {
    const [m, t, d, mt] = await Promise.all([get('members', 'select=*'), get('tasks', 'select=*'), get('task_done', 'select=*'), get('meetings', 'select=*&order=held_on.desc')]);
    Object.assign(D, { members: m, tasks: t, done: d, meetings: mt });
    try { D.props = await get('proposals', 'select=id,status'); } catch (e) { D.props = []; }
  } catch (e) { return stop('تعذّر تحميل البيانات (' + e.message + '). تحقق من الاتصال أو سجّل الدخول من التطبيق.'); }
  const me = D.members.find(x => same(x.email, session.user && session.user.email));
  $('who').textContent = me ? '👤 ' + me.name : '';
  $('msg').hidden = true; $('dash').hidden = false;
  render();
}

const nm = e => (D.members.find(m => same(m.email, e)) || {}).name || 'غير مُسند';
function st(t) {
  if (t.for_all) {
    const n = D.done.filter(x => x.task_id === t.id).length, tot = D.members.length || 1;
    return n >= tot ? 'done' : n > 0 ? 'doing' : 'todo';
  }
  return t.status;
}
const isLate = t => st(t) !== 'done' && t.due_on && t.due_on < today();

function donut(parts) {
  const tot = parts.reduce((a, p) => a + p.v, 0), R = 54, C = 2 * Math.PI * R;
  let off = 0;
  const segs = tot ? parts.filter(p => p.v).map(p => {
    const len = p.v / tot * C;
    const s = '<circle r="' + R + '" cx="70" cy="70" fill="none" style="stroke:' + p.c + '" stroke-width="18" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '" transform="rotate(-90 70 70)"/>';
    off += len; return s;
  }).join('') : '';
  const pct = tot ? Math.round(parts[2].v / tot * 100) : 0;
  return '<svg viewBox="0 0 140 140" role="img" aria-label="نسبة الإنجاز ' + pct + '%"><circle r="' + R + '" cx="70" cy="70" fill="none" style="stroke:var(--col)" stroke-width="18"/>' + segs +
    '<text x="70" y="76" text-anchor="middle" style="fill:var(--ink);font-size:26px;font-weight:800">' + pct + '%</text></svg>';
}
const stack = (a, b, c, tot) => tot ? '<div class="stack"><i style="width:' + a / tot * 100 + '%;background:var(--ok)"></i><i style="width:' + b / tot * 100 + '%;background:var(--doing)"></i><i style="width:' + c / tot * 100 + '%;background:var(--late)"></i></div>' : '<div class="stack"></div>';
const listRow = (t, chip, cls) => '<div class="li"><div><div class="li-title">' + esc(t.title) + '</div><div class="li-sub">' + (t.for_all ? '👥 الفريق' : '👤 ' + esc(nm(t.assignee_email))) + '</div></div><span class="chip ' + cls + '">' + esc(chip) + '</span></div>';

function render() {
  const T = D.tasks.filter(t => !F || t.meeting_id === F);
  const cnt = { todo: 0, doing: 0, done: 0 };
  T.forEach(t => { const s = st(t); cnt[s] = (cnt[s] || 0) + 1; });
  const open = T.filter(t => st(t) !== 'done'), late = open.filter(isLate);
  const soon = open.filter(t => t.due_on && t.due_on >= today() && daysTo(t.due_on) <= 3);
  const rate = T.length ? Math.round(cnt.done / T.length * 100) : 0;
  const openProps = D.props.filter(p => p.status === 'open').length;

  const members = D.members.map(m => {
    const mine = T.filter(t => !t.for_all && same(t.assignee_email, m.email));
    const dn = mine.filter(t => st(t) === 'done').length, lt = mine.filter(isLate).length, op = mine.length - dn;
    const g = T.filter(t => t.for_all), gd = g.filter(t => D.done.some(x => x.task_id === t.id && same(x.email, m.email))).length;
    return '<div class="row"><div class="rh"><span>' + esc(m.name) + '</span><span class="m">' + dn + ' منجزة · ' + op + ' مفتوحة' + (lt ? ' · ' + lt + ' متأخرة' : '') + (g.length ? ' · جماعية ' + gd + '/' + g.length : '') + '</span></div>' + stack(dn, op - lt, lt, mine.length) + '</div>';
  }).join('') || '<div class="empty"><span class="empty-icon">👥</span><span>لا يوجد أعضاء.</span></div>';

  const groups = D.meetings.map(m => ({ n: m.title, id: m.id })).concat([{ n: 'بدون مشروع', id: null }]).map(g => {
    const a = T.filter(t => (t.meeting_id || null) === g.id), d = a.filter(t => st(t) === 'done').length;
    return { n: g.n, tot: a.length, d };
  }).filter(g => g.tot).map(g => {
    const p = Math.round(g.d / g.tot * 100);
    return '<div class="row"><div class="rh"><span>' + esc(g.n) + '</span><span class="m">' + g.d + '/' + g.tot + ' (' + p + '%)</span></div><div class="stack"><i style="width:' + p + '%;background:var(--ok)"></i></div></div>';
  }).join('') || '<div class="empty"><span class="empty-icon">📋</span><span>لا توجد مشاريع.</span></div>';

  const byDue = (a, b) => a.due_on.localeCompare(b.due_on);
  const lateList = late.slice().sort(byDue).slice(0, 8).map(t => listRow(t, 'متأخرة ' + (-daysTo(t.due_on)) + ' يوم', 'late')).join('') || '<div class="empty"><span class="empty-icon">🎉</span><span>لا توجد مهام متأخرة</span></div>';
  const upList = open.filter(t => t.due_on && !isLate(t) && daysTo(t.due_on) <= 7).sort(byDue).slice(0, 8).map(t => { const n = daysTo(t.due_on); return listRow(t, n === 0 ? 'اليوم' : n === 1 ? 'غداً' : 'بعد ' + n + ' أيام', n <= 1 ? 'soon' : ''); }).join('') || '<div class="empty"><span class="empty-icon">📅</span><span>لا توجد مهام قريبة</span></div>';

  $('dash').innerHTML =
    '<div class="bar"><select id="fm" aria-label="تصفية حسب المشروع"><option value="">كل المشاريع والاجتماعات</option>' + D.meetings.map(m => '<option value="' + esc(m.id) + '"' + (F === m.id ? ' selected' : '') + '>' + esc(m.title) + '</option>').join('') + '</select><span class="sp"></span><span class="m">آخر تحديث: ' + new Date().toLocaleTimeString('ar') + '</span></div>' +
    '<div class="kpis">' +
      '<div class="kpi"><b>' + T.length + '</b><span>إجمالي المهام</span></div>' +
      '<div class="kpi ok"><b>' + cnt.done + '</b><span>منجزة</span></div>' +
      '<div class="kpi"><b>' + cnt.doing + '</b><span>قيد العمل</span></div>' +
      '<div class="kpi late"><b>' + late.length + '</b><span>متأخرة</span></div>' +
      '<div class="kpi soon"><b>' + soon.length + '</b><span>خلال 3 أيام</span></div>' +
      '<div class="kpi"><b>' + openProps + '</b><span>تصويتات مفتوحة</span></div>' +
    '</div>' +
    '<div class="grid">' +
      '<div class="card"><h2>توزيع حالات المهام</h2><div class="donutwrap">' + donut([{ v: cnt.todo, c: 'var(--todo)' }, { v: cnt.doing, c: 'var(--doing)' }, { v: cnt.done, c: 'var(--ok)' }]) +
        '<div class="leg"><span><i style="background:var(--ok)"></i>منجزة ' + cnt.done + '</span><span><i style="background:var(--doing)"></i>قيد العمل ' + cnt.doing + '</span><span><i style="background:var(--todo)"></i>للتنفيذ ' + cnt.todo + '</span><span class="m">نسبة الإنجاز ' + rate + '%</span></div></div></div>' +
      '<div class="card"><h2>تقدم المشاريع</h2>' + groups + '</div>' +
    '</div>' +
    '<div class="card" style="margin-bottom:16px"><h2>حمل العمل لكل عضو</h2>' + members + '<div class="m" style="margin-top:12px"><span style="color:var(--ok)">■</span> منجزة &nbsp;<span style="color:var(--doing)">■</span> مفتوحة &nbsp;<span style="color:var(--late)">■</span> متأخرة</div></div>' +
    '<div class="grid"><div class="card"><h2>⚠️ مهام متأخرة</h2>' + lateList + '</div><div class="card"><h2>📅 قادمة هذا الأسبوع</h2>' + upList + '</div></div>';
  $('fm').onchange = e => { F = e.target.value; render(); };
}

$('rf').onclick = () => { $('rf').textContent = '⏳'; load().finally(() => { $('rf').textContent = '🔄 تحديث'; }); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
load();
</script>
</body>
</html>

name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Release Keystore
        working-directory: android/app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore \
              -alias matjark -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass matjark123 -keypass matjark123 \
              -dname "CN=Matjark, OU=TeamTasks, O=Matjark, L=Sanaa, S=Sanaa, C=YE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/*.apk dist-apk/team-tasks.apk || cp android/app/build/outputs/apk/*/*.apk dist-apk/team-tasks.apk
          cp dist-apk/team-tasks.apk dist-apk/app-release.apk
          ls -lh dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-tasks-apk
          path: dist-apk/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "📱 تطبيق أندرويد المستقل (APK) - أحدث إصدار"
          body: |
            ### 🤖 تطبيق مهام الفريق والمتجر (APK)
            تم إنشاء هذه النسخة تلقائياً بواسطة **GitHub Actions** من الفرع الرئيسي.
            
            #### 🌟 المزايا:
            - **إشعارات نظام 24 ساعة:** تظهر مباشرة في شريط إشعارات الهاتف مع نغمة واهتزاز وبدون أي قيود متصفح.
            - **أداء فائق وسرعة تشغيل:** تطبيق مستقل يعمل بكفاءة وأمان كامل.
            - **تحديث دائم:** يُبنى تلقائياً عند كل دفع وتحديث في المستودع.
            
            #### 📥 التحميل المباشر:
            - [**اضغط هنا لتحميل team-tasks.apk**](https://github.com/${{ github.repository }}/releases/latest/download/team-tasks.apk)
          files: |
            dist-apk/team-tasks.apk
            dist-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

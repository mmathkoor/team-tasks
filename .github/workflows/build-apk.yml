name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        working-directory: android/app
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkey -v -keystore release.keystore \
              -alias matjark -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass matjark123 -keypass matjark123 \
              -dname "CN=Matjark, OU=TeamTasks, O=Matjark, L=Sanaa, S=Sanaa, C=YE"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Release APK
        working-directory: android
        run: |
          if command -v gradle >/dev/null 2>&1; then
            gradle assembleRelease --no-daemon --stacktrace
          elif [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Installing gradle..."
            sudo apt-get update && sudo apt-get install -y gradle
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Prepare APK Asset
        run: |
          mkdir -p dist-apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-apk/team-tasks.apk \;
          cp dist-apk/team-tasks.apk dist-apk/app-release.apk
          ls -lh dist-apk/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "📱 تطبيق أندرويد للجوال (APK)"
          body: |
            ### 🤖 تطبيق مهام الفريق والمتجر (APK)
            أحدث نسخة جاهزة للتحميل والتثبيت المباشر على الهاتف.
          files: |
            dist-apk/team-tasks.apk
            dist-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

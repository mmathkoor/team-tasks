<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهام الفريق</title>
<link rel="preconnect" href="https://wrmpyywosathqxrjuicx.supabase.co" crossorigin>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#27408b">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#1c2433;--mute:#6b7280;--line:#e2e5ea;--acc:#27408b;--accsoft:#e8edf9;--late:#b42318;--latesoft:#fdecea;--soon:#b7791f;--soonsoft:#fdf3dc;--ok:#2f7d4f;--oksoft:#e6f4ec;--col:#e9ebef}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf1;--mute:#98a2b3;--line:#2a313d;--acc:#8fa8f0;--accsoft:#232c45;--late:#f08a80;--latesoft:#3a2222;--soon:#e6b85c;--soonsoft:#3a3220;--ok:#6cc58f;--oksoft:#1f3326;--col:#171b23}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 'Segoe UI',Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:1080px;margin:auto;padding:12px 14px 40px}
h1{font-size:20px;margin:0;font-weight:600}h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:600}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
button{cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){button.p{color:#12151c}}
button.dng{color:var(--late)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.m{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}.row .s{flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0 10px}
.top .row{align-items:center}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:4px;background:var(--bg);padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.nav button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 6px;border-radius:10px;font-weight:600}
.nav button.on{background:var(--accsoft);color:var(--acc)}
.nav .n{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:4px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;line-height:20px}
@media (prefers-color-scheme:dark){.nav .n{color:#12151c}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-size:22px;line-height:1.3}.stat span{font-size:12px;color:var(--mute)}
.stat.late b{color:var(--late)}.stat.soon b{color:var(--soon)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;background:transparent}.seg button.on{background:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#12151c}}
.tools .sp{flex:1}
.ctabs{display:none}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start}
.col{background:var(--col);border-radius:14px;padding:10px;min-height:140px;border:2px solid transparent}
.col.over{border-color:var(--acc)}
.col>.ch{display:flex;justify-content:space-between;align-items:center;margin:2px 4px 10px;font-weight:600;font-size:14px}
.col>.ch i{font-style:normal;font-weight:400;font-size:12px;background:var(--card);border-radius:10px;padding:0 9px;color:var(--mute)}
.col[data-st=todo]>.ch{color:var(--mute)}.col[data-st=doing]>.ch{color:var(--acc)}.col[data-st=done]>.ch{color:var(--ok)}
.tk{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.tk:hover{border-color:var(--acc)}.tk.drag{opacity:.4}
.tk .tt{font-weight:600;line-height:1.5}.tk.done .tt{text-decoration:line-through;color:var(--mute)}
.tk .nt{font-size:13px;color:var(--mute);margin-top:2px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;border-radius:20px;padding:0 9px;background:var(--col);color:var(--mute);line-height:22px}
.chip.all{background:var(--accsoft);color:var(--acc)}
.chip.late{background:var(--latesoft);color:var(--late)}.chip.soon{background:var(--soonsoft);color:var(--soon)}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.acts{display:flex;gap:6px;margin-top:8px}.acts button{flex:0 0 auto;font-size:13px;padding:3px 10px}
.empty{font-size:13px;color:var(--mute);text-align:center;padding:18px 0}
.pr .ttl{font-weight:600;font-size:16px}
.pr .det{white-space:pre-wrap;margin:6px 0}
.tally{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--col);margin:10px 0 6px}
.tally i{display:block;height:100%}.tally .y{background:var(--ok)}.tally .n{background:var(--late)}
.votes{display:flex;gap:8px;flex-wrap:wrap}
.votes button{flex:1 1 110px;padding:8px 6px}
.pa{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.pa button{font-size:13px;padding:3px 10px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:16px;width:min(520px,94vw);font:inherit}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{color:var(--ink);font-size:17px;margin-bottom:10px}
dialog label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
dialog label>*{display:block;width:100%;margin-top:3px;color:var(--ink)}
dialog .row label{margin-bottom:0}
dialog .dact{margin-top:12px}
#login{max-width:360px;margin:20vh auto}
@media (max-width:760px){
  .board{display:block}
  .ctabs{display:flex;gap:6px;margin-bottom:10px}
  .ctabs button{flex:1;padding:7px 4px;font-size:14px}.ctabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .col{display:none}.col.on{display:block}
  .stat b{font-size:19px}
}
@media (max-width:760px) and (prefers-color-scheme:dark){.ctabs button.on{color:#12151c}}
</style>
</head>
<body>
<main id="app"><p style="padding:24px;color:#6b7280;font:15px sans-serif;text-align:center;" dir="rtl">جارٍ الاتصال بقاعدة البيانات...</p></main>
<dialog id="dlg"></dialog>
<script>
// ==========================================
// أنظمة اصطياد الأخطاء لإظهار أي مشكلة لك بدلاً من الشاشة البيضاء
// ==========================================
function showErrorBox(msg) {
    const a = document.getElementById('app');
    if (a) a.innerHTML = '<div class="card" style="margin:40px auto;max-width:400px;border-color:var(--late);text-align:center">' +
        '<h2 style="color:var(--late);margin-bottom:10px">توقف الاتصال بقاعدة البيانات</h2>' +
        '<p style="color:var(--mute);margin-bottom:20px;font-size:14px;">' + msg + '</p>' +
        '<button class="p" onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" style="width:100%">إصلاح الجلسة وإعادة المحاولة 🔄</button>' +
    '</div>';
}
window.addEventListener('error', e => showErrorBox(e.message));
window.addEventListener('unhandledrejection', e => showErrorBox(e.reason?.message || e.reason || 'تعذر استرجاع البيانات من Supabase.'));

// ====== بيانات مشروعك ======
const SUPABASE_URL = 'https://wrmpyywosathqxrjuicx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndybXB5eXdvc2F0aHF4cmp1aWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDg2NDQsImV4cCI6MjEwNzQ4NDY0NH0.CoSwCocuTVWlVU6QBNpp_bZiuykVkMHSHpT11KC1uvU';
const VAPID_PUBLIC = 'BHxCfyzW8k847mfJYuR-EvsQjegMcA7an34Ls7kLj7ZvHe6mUeCKOoKtAjEIz53esjpN2IKB9EcYPxr3C2S3298';

const API = SUPABASE_URL, KEY = SUPABASE_ANON_KEY;
let AUTH = { s: null };
try { AUTH.s = JSON.parse(localStorage.getItem('sbs') || 'null'); } catch(e){}
const saveS = s => { AUTH.s = s; s ? localStorage.setItem('sbs', JSON.stringify(s)) : localStorage.removeItem('sbs'); };

async function tok() {
  const s = AUTH.s;
  if (!s) return KEY;
  if (s.expires_at && s.expires_at - 60 > Date.now() / 1000) return s.access_token;
  try {
    const r = await fetch(API + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const j = await r.json();
    if (!r.ok) { saveS(null); return KEY; }
    j.expires_at = Math.floor(Date.now() / 1000) + j.expires_in; saveS(j); return j.access_token;
  } catch (e) { return s?.access_token || KEY; }
}

class Q {
  constructor(t) { this.t = t; this.m = 'GET'; this.p = new URLSearchParams(); this.b = null; this.pf = ''; }
  select(c) { this.p.set('select', c || '*'); return this; }
  order(c, o = {}) { this.p.set('order', c + (o.ascending === false ? '.desc' : '.asc') + (o.nullsFirst ? '.nullsfirst' : '.nullslast')); return this; }
  eq(c, v) { this.p.append(c, 'eq.' + v); return this; }
  insert(o) { this.m = 'POST'; this.b = o; return this; }
  upsert(o) { this.m = 'POST'; this.b = o; this.pf = 'resolution=merge-duplicates'; return this; }
  update(o) { this.m = 'PATCH'; this.b = o; return this; }
  delete() { this.m = 'DELETE'; return this; }
  then(res, rej) { return this.run().then(res, rej); }
  async run() {
    try {
      const mut = this.m !== 'GET', h = { apikey: KEY, Authorization: 'Bearer ' + await tok(), 'Content-Type': 'application/json' };
      const pf = [this.pf, mut ? 'return=minimal' : ''].filter(Boolean).join(','); if (pf) h.Prefer = pf;
      const r = await fetch(API + '/rest/v1/' + this.t + '?' + this.p, { method: this.m, headers: h, body: this.b ? JSON.stringify(this.b) : undefined });
      if (!r.ok) { const e = await r.json().catch(() => ({})); return { data: null, error: { message: e.message || r.statusText } }; }
      return { data: mut ? null : await r.json(), error: null };
    } catch (e) { return { data: null, error: { message: 'تعذّر الاتصال بقاعدة البيانات. (تأكد من الإنترنت)' } }; }
  }
}

const sb = {
  from: t => new Q(t),
  auth: {
    getSession: async () => ({ data: { session: AUTH.s } }),
    signInWithPassword: async ({ email, password }) => {
      try {
        const r = await fetch(API + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const j = await r.json();
        if (!r.ok) return { error: { message: j.error_description || 'بيانات الدخول غير صحيحة' } };
        j.expires_at = Math.floor(Date.now() / 1000) + j.expires_in; saveS(j); init(); return { error: null };
      } catch (e) { return { error: { message: 'تعذّر الاتصال' } }; }
    },
    signOut: async () => saveS(null),
    updateUser: async ({ password }) => {
      try {
        const r = await fetch(API + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + await tok(), 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const j = await r.json().catch(() => ({}));
        return { error: r.ok ? null : { message: j.msg || 'تعذّر التحديث' } };
      } catch (e) { return { error: { message: 'تعذّر الاتصال' } }; }
    }
  }
};

const $ = id => document.getElementById(id);
const $app = $('app'), dlg = $('dlg');
const S = { me: null, members: [], meetings: [], tasks: [], done: [], props: [], votes: [], propsErr: false, view: 'board', filter: 'mine', meeting: '', col: 'todo', pf: 'open' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
const daysTo = d => Math.round((new Date(d) - new Date(today())) / 864e5);
const ST = { todo: 'للتنفيذ', doing: 'قيد العمل', done: 'منجزة' };
const ACT = { todo: [['doing', 'بدء'], ['done', 'إنجاز ✓']], doing: [['done', 'إنجاز ✓'], ['todo', 'إرجاع']], done: [['doing', 'إعادة فتح']] };
const ACT_ALL = { todo: [['done', 'إنجاز ✓']], done: [['todo', 'إعادة فتح']] };
const PST = { open: 'مفتوح', accepted: 'مقبول', rejected: 'مرفوض', closed: 'مغلق' };
const nm = e => S.members.find(m => same(m.email, e))?.name || 'غير مُسند';
const isAdmin = () => S.me && S.me.role === 'admin';
const canDel = t => isAdmin() || (S.me && same(t.created_by, S.me.email));
const mine = t => t.for_all || (S.me && same(t.assignee_email, S.me.email));
const doneBy = t => S.done.filter(d => d.task_id === t.id);
const eff = t => t.for_all ? (S.me && doneBy(t).some(d => same(d.email, S.me.email)) ? 'done' : 'todo') : t.status;
const run = async p => { const { error } = await p; if (error) alert('خطأ: ' + error.message); load(); };

async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || !session.user || !session.user.email) {
      saveS(null);
      return loginView();
    }
    const email = session.user.email;
    
    const { data: members, error } = await sb.from('members').select('*');
    if (error) {
        showErrorBox('لا يمكن جلب قائمة الأعضاء من Supabase. (' + error.message + ')');
        return; 
    }
    
    const me = members.find(m => same(m.email, email));
    if (!members.length || !me) { 
        saveS(null); 
        $app.innerHTML = '<div class="card" id="login">هذا الإيميل غير مضاف للفريق.<br><br><button onclick="location.reload()">رجوع</button></div>'; 
        return; 
    }
    
    S.members = members; S.me = me;
    await load();
  } catch (err) {
      showErrorBox('خطأ برمجي أثناء التهيئة: ' + err.message);
  }
}

async function load() {
  const [m, t, p, v, d] = await Promise.all([
    sb.from('meetings').select('*').order('held_on', { ascending: false }),
    sb.from('tasks').select('*').order('due_on', { ascending: true, nullsFirst: false }),
    sb.from('proposals').select('*').order('created_at', { ascending: false }),
    sb.from('votes').select('*'),
    sb.from('task_done').select('*')
  ]);
  
  if (!m.error) S.meetings = m.data || [];
  if (!t.error) S.tasks = t.data || [];
  if (!d.error) S.done = d.data || [];
  S.propsErr = !!(p.error || v.error);
  if (!p.error) S.props = p.data || [];
  if (!v.error) S.votes = v.data || [];
  
  render();
}

function loginView() {
  $app.innerHTML = '<div class="card" id="login"><h1>مهام الفريق</h1><p class="m">سجّل الدخول بإيميلك وكلمة المرور.</p>' +
  '<div class="row"><input id="em" type="email" placeholder="الالكتروني" dir="ltr"></div>' +
  '<div class="row" style="margin-top:8px"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr"><button class="p s" id="go">دخول</button></div><p class="m" id="msg"></p></div>';
  const doLogin = async () => {
    $('msg').textContent = 'جارٍ الدخول...';
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    $('msg').textContent = error ? error.message : '';
  };
  $('go').onclick = doLogin;
  $('pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
const logout = async () => { await sb.auth.signOut(); localStorage.clear(); location.reload(); };

const isClosed = p => ['accepted', 'rejected', 'closed'].includes(p.status);
function render() {
  if (!S.me) return;
  const props = S.props || [];
  const openProps = props.filter(p => !isClosed(p)).length;
  const badge = openProps ? '<span class="n">' + openProps + '</span>' : '';
  
  $app.innerHTML = '<div class="top"><h1>مهام الفريق</h1><div class="row s"><span class="m">' + esc(S.me.name) + '</span><button id="rf">تحديث</button></div></div>' +
  '<div class="nav">' +
    '<button data-nv="board" class="' + (S.view === 'board' ? 'on' : '') + '">لوحة المهام</button>' +
    '<button data-nv="props" class="' + (S.view === 'props' ? 'on' : '') + '">المقترحات' + badge + '</button>' +
    '<button data-nv="set" class="' + (S.view === 'set' ? 'on' : '') + '">الإعدادات</button>' +
  '</div>' +
  (S.view === 'board' ? boardView() : S.view === 'props' ? propsView() : settingsView());
  
  $('rf').onclick = () => { $('rf').textContent = '...'; load(); };
  document.querySelectorAll('[data-nv]').forEach(b => b.onclick = () => { S.view = b.dataset.nv; render(); });
  if (S.view === 'board') bindBoard(); else if (S.view === 'props') bindProps(); else bindSettings();
}

function dueInfo(t) {
  if (!t.due_on) return null;
  if (eff(t) === 'done') return { c: '', t: t.due_on };
  if (t.due_on < today()) return { c: 'late', t: 'متأخرة · ' + t.due_on };
  const d = daysTo(t.due_on);
  return d <= 1 ? { c: 'soon', t: d ? 'غداً' : 'اليوم' } : { c: '', t: t.due_on };
}

function card(t) {
  const st = eff(t), d = dueInfo(t), mt = S.meetings.find(m => m.id === t.meeting_id);
  const acts = (t.for_all ? ACT_ALL : ACT)[st];
  const dn = doneBy(t);
  
  let waBtn = '';
  if (!t.for_all && t.assignee_email && S.me && !same(t.assignee_email, S.me.email) && st !== 'done') {
    const msg = 'مرحباً ' + nm(t.assignee_email) + '،\nلديك مهمة جديدة مطلوب إنجازها:\n*' + t.title + '*\n' + (t.due_on ? 'تاريخ الاستحقاق: ' + t.due_on : '') + '\nبالتوفيق!';
    waBtn = '<a href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" class="chip ok" style="text-decoration:none;border:none">💬 مشاركة واتساب</a>';
  }

  let metaAll = t.for_all 
    ? '<span class="chip all" title="' + esc(dn.map(x => nm(x.email)).join('، ')) + '">👥 الكل · أنجز ' + dn.length + ' من ' + S.members.length + '</span>' 
    : '<span class="chip">' + esc(nm(t.assignee_email)) + '</span>';
    
  let metaD = d ? '<span class="chip ' + d.c + '">' + esc(d.t) + '</span>' : '';
  let metaMt = mt ? '<span class="chip">' + esc(mt.title) + '</span>' : '';
  let actsHtml = acts.map(([k, l]) => '<button data-mv="' + t.id + '" data-to="' + k + '">' + l + '</button>').join('');

  return '<div class="tk ' + st + '" draggable="true" data-id="' + t.id + '">' +
    '<div class="tt">' + esc(t.title) + '</div>' +
    (t.notes ? '<div class="nt">' + esc(t.notes) + '</div>' : '') +
    '<div class="meta">' + metaAll + metaD + metaMt + waBtn + '</div>' +
    '<div class="acts">' + actsHtml + '</div>' +
  '</div>';
}

function boardView() {
  const all = S.tasks.filter(t => (!S.meeting || t.meeting_id === S.meeting) && (S.filter === 'all' || mine(t)));
  const open = all.filter(t => eff(t) !== 'done');
  const late = open.filter(t => t.due_on && t.due_on < today()).length;
  const soon = open.filter(t => t.due_on && t.due_on >= today() && daysTo(t.due_on) <= 1).length;
  const cols = Object.keys(ST).map(k => {
    const items = all.filter(t => eff(t) === k);
    return '<div class="col ' + (S.col === k ? 'on' : '') + '" data-st="' + k + '"><div class="ch"><span>' + ST[k] + '</span><i>' + items.length + '</i></div>' +
      (items.length ? items.map(card).join('') : '<div class="empty">لا مهام</div>') + '</div>';
  }).join('');
  
  let mtOpts = '<option value="">كل الاجتماعات</option>' + S.meetings.map(m => '<option value="' + m.id + '" ' + (S.meeting === m.id ? 'selected' : '') + '>' + esc(m.title) + '</option>').join('');
  let btnHtml = isAdmin() ? '<button id="nmt">+ اجتماع</button>' : '';
  let tabs = Object.keys(ST).map(k => '<button data-c="' + k + '" class="' + (S.col === k ? 'on' : '') + '">' + ST[k] + ' (' + all.filter(t => eff(t) === k).length + ')</button>').join('');

  return '<div class="stats">' +
    '<div class="stat"><b>' + open.length + '</b><span>مهام مفتوحة</span></div>' +
    '<div class="stat late"><b>' + late + '</b><span>متأخرة</span></div>' +
    '<div class="stat soon"><b>' + soon + '</b><span>تستحق اليوم/غداً</span></div>' +
  '</div>' +
  '<div class="tools">' +
    '<div class="seg"><button data-f="mine" class="' + (S.filter === 'mine' ? 'on' : '') + '">مهامي</button><button data-f="all" class="' + (S.filter === 'all' ? 'on' : '') + '">كل الفريق</button></div>' +
    '<select id="fm" aria-label="الاجتماع">' + mtOpts + '</select>' +
    '<span class="sp"></span>' +
    btnHtml + '<button class="p" id="nt">+ مهمة</button>' +
  '</div>' +
  '<div class="ctabs">' + tabs + '</div>' +
  '<div class="board">' + cols + '</div>';
}

function bindBoard() {
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.col = b.dataset.c; render(); });
  $('fm').onchange = e => { S.meeting = e.target.value; render(); };
  $('nt').onclick = () => taskDialog(null);
  if ($('nmt')) $('nmt').onclick = () => { const t = prompt('اسم الاجتماع'); if (t && t.trim()) run(sb.from('meetings').insert({ title: t.trim() })); };
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = e => { e.stopPropagation(); moveTask(b.dataset.mv, b.dataset.to); });
  document.querySelectorAll('.tk').forEach(el => {
    el.onclick = () => taskDialog(S.tasks.find(t => t.id === el.dataset.id));
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('drag'); };
    el.ondragend = () => el.classList.remove('drag');
  });
  document.querySelectorAll('.col').forEach(c => {
    c.ondragover = e => { e.preventDefault(); c.classList.add('over'); };
    c.ondragleave = () => c.classList.remove('over');
    c.ondrop = e => { e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) moveTask(id, c.dataset.st); };
  });
}

async function moveTask(id, to) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || eff(t) === to || !S.me) return;
  S.col = to;
  if (t.for_all) {
    if (to === 'doing') return;
    if (to === 'done') {
      S.done.push({ task_id: id, email: S.me.email }); render();
      run(sb.from('task_done').upsert({ task_id: id, email: S.me.email }));
    } else {
      S.done = S.done.filter(d => !(d.task_id === id && same(d.email, S.me.email))); render();
      run(sb.from('task_done').delete().eq('task_id', id).eq('email', S.me.email));
    }
    return;
  }
  const prev = t.status; t.status = to; render();
  const { error } = await sb.from('tasks').update({ status: to }).eq('id', id);
  if (error) { t.status = prev; alert('خطأ: ' + error.message); load(); }
}

function taskDialog(t, pre = {}) {
  const x = t || pre, edit = !!t;
  const asVal = x.for_all ? '__all' : (x.assignee_email || (S.me ? S.me.email : ''));
  
  let asOpts = '<option value="__all" ' + (asVal === '__all' ? 'selected' : '') + '>👥 الكل</option>' +
               '<option value="" ' + (asVal === '' ? 'selected' : '') + '>غير مُسند</option>' +
               S.members.map(m => '<option value="' + esc(m.email) + '" ' + (same(m.email, asVal) ? 'selected' : '') + '>' + esc(m.name) + '</option>').join('');
               
  let mtOpts = '<option value="">بدون ارتباط</option>' + S.meetings.map(m => '<option value="' + m.id + '" ' + (x.meeting_id === m.id ? 'selected' : '') + '>' + esc(m.title) + '</option>').join('');
  
  let stOpts = Object.entries(ST).map(([k, v]) => '<option value="' + k + '" ' + ((x.status || 'todo') === k ? 'selected' : '') + '>' + v + '</option>').join('');
  
  let dlBtn = edit && canDel(t) ? '<button class="dng" id="f_dl">حذف</button>' : '';

  dlg.innerHTML = '<h2>' + (edit ? 'تعديل المهمة' : 'مهمة جديدة') + '</h2>' +
  '<label>العنوان<input id="f_ti" value="' + esc(x.title || '') + '" placeholder="عنوان المهمة"></label>' +
  '<label>تفاصيل (اختياري)<textarea id="f_no" rows="3">' + esc(x.notes || '') + '</textarea></label>' +
  '<div class="row">' +
    '<label>المسؤول (لإشعار الشريك عبر الواتس)<select id="f_as">' + asOpts + '</select></label>' +
    '<label>تاريخ الاستحقاق<input id="f_du" type="date" value="' + esc(x.due_on || '') + '"></label>' +
  '</div>' +
  '<div class="row" style="margin-top:10px">' +
    '<label>الاجتماع<select id="f_mt">' + mtOpts + '</select></label>' +
    '<label id="f_stw">الحالة<select id="f_st">' + stOpts + '</select></label>' +
  '</div>' +
  '<p class="m" id="f_hint" style="margin:8px 0 0">مهمة «الكل»: ينجزها كل عضو بنفسه.</p>' +
  '<div class="row dact"><button class="p" id="f_sv">حفظ</button>' + dlBtn + '<button id="f_cx">إلغاء</button></div>';
  
  const sync = () => { const a = $('f_as').value === '__all'; $('f_stw').style.display = a ? 'none' : ''; $('f_hint').style.display = a ? '' : 'none'; };
  $('f_as').onchange = sync; sync();
  $('f_cx').onclick = () => dlg.close();
  $('f_sv').onclick = async () => {
    const title = $('f_ti').value.trim(); if (!title) return $('f_ti').focus();
    const all = $('f_as').value === '__all';
    const row = { title, notes: $('f_no').value.trim() || null, for_all: all, assignee_email: all ? null : ($('f_as').value || null), due_on: $('f_du').value || null, meeting_id: $('f_mt').value || null, status: all ? 'todo' : $('f_st').value };
    if (!edit) row.created_by = S.me.email;
    const { error } = edit ? await sb.from('tasks').update(row).eq('id', t.id) : await sb.from('tasks').insert(row);
    if (error) return alert('خطأ: ' + error.message);
    dlg.close(); load();
  };
  if (edit && canDel(t)) $('f_dl').onclick = () => { if (confirm('حذف المهمة؟')) { dlg.close(); run(sb.from('tasks').delete().eq('id', t.id)); } };
  dlg.showModal(); if (!edit) $('f_ti').focus();
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- المقترحات ---------- */
function parseOptions(p) {
  if (!p || !p.options) return ['موافق', 'معارض'];
  if (Array.isArray(p.options)) return p.options;
  try { const arr = JSON.parse(p.options); if (Array.isArray(arr)) return arr; } catch(e) {}
  if (typeof p.options === 'string' && p.options.includes(',')) return p.options.split(',').map(s => s.trim()).filter(Boolean);
  return ['موافق', 'معارض'];
}

function propCard(p) {
  const opts = parseOptions(p);
  const vts = (S.votes || []).filter(x => x.proposal_id === p.id);
  const myVote = S.me ? vts.find(x => same(x.email, S.me.email)) : null;
  const total = vts.length;
  const can = S.me && (same(p.author_email, S.me.email) || isAdmin());
  const open = !isClosed(p);

  let res = opts.map((opt, i) => {
    const ov = vts.filter(x => x.option_idx == i || (x.option_idx == null && x.value == (i===0?1:-1))); 
    const w = total ? ((ov.length / total) * 100).toFixed(0) : 0;
    
    let vlist = '';
    if (ov.length) {
      let items = ov.map(x => '<b>' + esc(nm(x.email)) + '</b>' + (x.note ? ' <i>(' + esc(x.note) + ')</i>' : '')).join('<br>');
      vlist = '<div style="font-size:12px;color:var(--mute);margin-top:4px;padding:4px;background:var(--col);border-radius:4px">' + items + '</div>';
    }
    
    return '<div style="margin-bottom:10px">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px"><span>' + esc(opt) + '</span><span>' + ov.length + ' صوت (' + w + '%)</span></div>' +
      '<div class="tally" style="margin:4px 0"><i style="width:' + w + '%;background:var(--ok)"></i></div>' +
      vlist +
    '</div>';
  }).join('');

  let act = '';
  if (open) {
    let optsHtml = opts.map((o, i) => {
      let sel = (myVote && (myVote.option_idx == i || (myVote.option_idx == null && myVote.value == (i===0?1:-1)))) ? 'selected' : '';
      return '<option value="' + i + '" ' + sel + '>' + esc(o) + '</option>';
    }).join('');
    
    let noteVal = (myVote && myVote.note) ? esc(myVote.note) : '';
    let btnTxt = myVote ? 'تحديث التصويت' : 'تصويت';
    
    act = '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">' +
      '<select id="v_opt_' + p.id + '" style="flex:1;min-width:120px"><option value="">-- اختر --</option>' + optsHtml + '</select>' +
      '<input id="v_not_' + p.id + '" placeholder="ملاحظة (اختياري)..." value="' + noteVal + '" style="flex:2;min-width:140px">' +
      '<button class="p" data-cast="' + p.id + '">' + btnTxt + '</button>' +
    '</div>';
  }
  
  let actionBtns = '';
  if (can) {
    if (open) {
       actionBtns = '<button data-ps="' + p.id + '" data-to="accepted">اعتماد</button>' +
                    '<button data-ps="' + p.id + '" data-to="rejected">رفض</button>';
    } else {
       actionBtns = '<button data-ps="' + p.id + '" data-to="open">إعادة فتح</button>';
    }
    actionBtns += '<button class="dng" data-pdel="' + p.id + '">حذف</button>';
  }

  let detHtml = p.details ? '<div class="det">' + esc(p.details) + '</div>' : '';

  return '<div class="card pr">' +
    '<div class="bar"><span class="ttl">' + esc(p.title) + '</span><span class="chip ' + (p.status === 'accepted' ? 'ok' : p.status === 'rejected' ? 'late' : 'all') + '">' + esc(PST[p.status] || p.status) + '</span></div>' +
    detHtml +
    '<div class="m">بواسطة ' + esc(nm(p.author_email)) + ' · ' + esc((p.created_at || '').slice(0, 10)) + '</div>' +
    '<div style="margin-top:14px">' + res + '</div>' +
    act +
    '<div class="pa">' +
      '<button data-totask="' + p.id + '">تحويل إلى مهمة</button>' +
      actionBtns +
    '</div>' +
  '</div>';
}

function propsView() {
  if (S.propsErr) return '<div class="card"><b style="color:var(--late)">خطأ في المقترحات.</b><p class="m">يرجى التأكد من إضافة الأعمدة options, option_idx, note.</p></div>';
  const list = S.props.filter(p => S.pf === 'open' ? !isClosed(p) : isClosed(p));
  let listHtml = list.length ? list.map(propCard).join('') : '<div class="card empty">لا توجد مقترحات في هذه القائمة.</div>';
  
  return '<div class="tools"><div class="seg"><button data-pf="open" class="' + (S.pf === 'open' ? 'on' : '') + '">مفتوحة للتصويت</button><button data-pf="closed" class="' + (S.pf === 'closed' ? 'on' : '') + '">المغلقة</button></div><span class="sp"></span><button class="p" id="np">+ مقترح جديد</button></div>' +
  listHtml;
}

function bindProps() {
  if (S.propsErr) return;
  document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { S.pf = b.dataset.pf; render(); });
  $('np').onclick = propDialog;
  
  document.querySelectorAll('[data-cast]').forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.cast;
      const optSelect = document.getElementById('v_opt_' + pid);
      if (!optSelect || optSelect.value === '') return alert('الرجاء اختيار خيار.');
      const note = document.getElementById('v_not_' + pid).value.trim();
      btn.textContent = '...'; btn.disabled = true;
      const { error } = await sb.from('votes').upsert({ proposal_id: pid, email: S.me.email, option_idx: parseInt(optSelect.value), value: (optSelect.value == 0 ? 1 : -1), note: note || null });
      if (error) alert('خطأ: ' + error.message);
      load();
    };
  });
  
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => run(sb.from('proposals').update({ status: b.dataset.to }).eq('id', b.dataset.ps)));
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => { if (confirm('حذف؟')) run(sb.from('proposals').delete().eq('id', b.dataset.pdel)); });
  document.querySelectorAll('[data-totask]').forEach(b => b.onclick = () => { const p = S.props.find(x => x.id === b.dataset.totask); taskDialog(null, { title: p.title, notes: p.details || '', for_all: true }); });
}

function propDialog() {
  dlg.innerHTML = '<h2>مقترح تصويت جديد</h2>' +
  '<label>العنوان<input id="p_ti"></label>' +
  '<label>التفاصيل<textarea id="p_de" rows="2"></textarea></label>' +
  '<label>الخيارات (اكتب كل خيار في سطر مستقل)<textarea id="p_op" rows="3" placeholder="الخيار الأول\nالخيار الثاني"></textarea></label>' +
  '<div class="row dact"><button class="p" id="p_sv">نشر</button><button id="p_cx">إلغاء</button></div>';
  
  $('p_cx').onclick = () => dlg.close();
  $('p_sv').onclick = async () => {
    const title = $('p_ti').value.trim(); if (!title) return $('p_ti').focus();
    let rawOpts = $('p_op').value.split('\n').map(x => x.trim()).filter(Boolean);
    if (rawOpts.length === 0) rawOpts = ['موافق', 'غير موافق'];
    $('p_sv').disabled = true;
    const { error } = await sb.from('proposals').insert({ title, details: $('p_de').value.trim() || null, author_email: S.me.email, status: 'open', options: JSON.stringify(rawOpts) });
    if (error) return alert('خطأ: ' + error.message);
    dlg.close(); load();
  };
  dlg.showModal(); $('p_ti').focus();
}

/* ---------- الإعدادات ---------- */
function settingsView() {
  let adminHtml = '';
  if (isAdmin()) {
    let membersList = S.members.map(m => {
      let rmBtn = (S.me && same(m.email, S.me.email)) ? '' : '<button class="s" data-rm="' + esc(m.email) + '">إزالة</button>';
      return '<div class="row" style="align-items:center;margin-bottom:6px"><span>' + esc(m.name) + ' <span class="m" dir="ltr">' + esc(m.email) + '</span></span>' + rmBtn + '</div>';
    }).join('');
    
    adminHtml = '<div class="card"><h2>الأعضاء (للأدمن)</h2>' + membersList + 
      '<div class="row"><input id="ne" dir="ltr" placeholder="إيميل العضو الجديد"><input id="nn" placeholder="الاسم"><button class="p s" id="addm">إضافة</button></div></div>';
  }

  return '<div class="card">' +
    '<h2>إشعارات الجوال</h2>' +
    '<div class="row"><button class="p s" id="push">تفعيل الإشعارات الآن</button></div>' +
    '<p class="m" id="pm"></p>' +
  '</div>' +
  '<div class="card"><h2>تغيير كلمة المرور</h2><div class="row"><input id="np" type="password" dir="ltr" placeholder="6 أحرف على الأقل"><button class="s" id="svp">حفظ</button></div></div>' +
  adminHtml +
  '<div class="card"><div class="bar"><span class="m">' + esc(S.me?.name || '') + '</span><button id="out">تسجيل خروج</button></div></div>';
}

function bindSettings() {
  $('out').onclick = logout;
  $('push').onclick = async () => {
    const pm = $('pm');
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return pm.textContent = 'جهازك لا يدعم الإشعارات.';
      if (await Notification.requestPermission() !== 'granted') return pm.textContent = 'لم تُمنح الصلاحية.';
      const reg = await navigator.serviceWorker.ready;
      const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      const { error } = await sb.from('push_subs').upsert({ endpoint: sub.endpoint, email: S.me.email, sub: sub.toJSON() });
      pm.innerHTML = error ? 'خطأ: ' + error.message : '<b style="color:var(--ok)">تم تفعيل الإشعارات بنجاح.</b>';
    } catch (e) { pm.textContent = 'خطأ: ' + e.message; }
  };
  $('svp').onclick = async () => { 
    const v = $('np').value; if (v.length < 6) return alert('6 أحرف على الأقل'); 
    const { error } = await sb.auth.updateUser({ password: v }); 
    alert(error ? error.message : 'تم تغيير كلمة المرور'); $('np').value = ''; 
  };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('إزالة؟')) run(sb.from('members').delete().eq('email', b.dataset.rm)); });
  if ($('addm')) $('addm').onclick = () => { const e = $('ne').value.trim(), n = $('nn').value.trim(); if (e && n) run(sb.from('members').insert({ email: e, name: n })); };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && !dlg.open) load(); });
init();
</script>

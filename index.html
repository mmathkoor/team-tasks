.pr .ttl { font-weight: 800; font-size: 18px; line-height: 1.3; }
.pr .det { white-space: pre-wrap; margin: 12px 0; font-size: 14px; color: var(--mute); background: var(--col); padding: 12px; border-radius: 8px; }

dialog { border: none; border-radius: var(--rad); background: var(--card); color: var(--ink); padding: 24px; width: min(540px, 92vw); box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25); font: inherit; }
dialog::backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
dialog h2 { font-size: 20px; margin-bottom: 20px; font-weight: 800; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
dialog label { display: block; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 16px; }
dialog label > * { display: block; width: 100%; margin-top: 8px; font-weight: 400; }
dialog .row label { margin-bottom: 0; }
dialog .dact { margin-top: 24px; gap: 12px; justify-content: flex-end; }
dialog .dact button { min-width: 110px; padding: 10px; }
.multi-options { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }

@media (max-width: 768px) {

<body>
<main id="app"><p style="padding:40px;text-align:center;color:var(--mute);font-weight:600;" dir="rtl">جارٍ تهيئة النظام...</p></main>
<dialog id="dlg"></dialog>
<script>
function showErrorBox(msg) {
    const a = document.getElementById('app');
    if (a) a.innerHTML = '<div class="card" style="margin:40px auto;max-width:400px;text-align:center">' +
        '<h2 style="color:var(--late);margin-bottom:10px">توقف الاتصال مؤقتاً</h2>' +
        '<p style="color:var(--mute);margin-bottom:20px;font-size:14px;">' + msg + '</p>' +
        '<button class="p" onclick="localStorage.clear(); sessionStorage.clear(); window.location.reload(true);" style="width:100%">تحديث وإصلاح تلقائي 🔄</button>' +
    '</div>';
}
window.addEventListener('error', e => showErrorBox(e.message));
window.addEventListener('unhandledrejection', e => showErrorBox(e.reason?.message || e.reason || 'خطأ في جلب البيانات من الخادم.'));

const SUPABASE_URL = 'https://wrmpyywosathqxrjuicx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndybXB5eXdvc2F0aHF4cmp1aWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MDg2NDQsImV4cCI6MjEwNzQ4NDY0NH0.CoSwCocuTVWlVU6QBNpp_bZiuykVkMHSHpT11KC1uvU';
const VAPID_PUBLIC = 'BC3e8bZLkH-21W_OzBDlmvKyj97z7Xwuv9geEaWz4MN7eBoty47sIUVqBO0hYzR3hNROhmIloPzMcNICfo1rM0A';
const CACHE_KEY = 'cache_v10';

const API = SUPABASE_URL, KEY = SUPABASE_ANON_KEY;
let AUTH = { s: null };
try { AUTH.s = JSON.parse(localStorage.getItem('sbs') || 'null'); } catch(e){}
const saveS = s => { AUTH.s = s; s ? localStorage.setItem('sbs', JSON.stringify(s)) : localStorage.removeItem('sbs'); };

async function tok() {
  const s = AUTH.s;
  if (!s) return KEY;
  if (s.expires_at && s.expires_at - 60 > Date.now() / 1000) return s.access_token;
  try {
    const r = await fetch(API + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
    const j = await r.json();
    if (!r.ok) { saveS(null); return KEY; }
    j.expires_at = Math.floor(Date.now() / 1000) + j.expires_in; saveS(j); return j.access_token;
  } catch (e) { return s?.access_token || KEY; }
}

class Q {
  constructor(t) { this.t = t; this.m = 'GET'; this.p = new URLSearchParams(); this.b = null; this.pf = ''; }
  select(c) { this.p.set('select', c || '*'); return this; }
  order(c, o = {}) { this.p.set('order', c + (o.ascending === false ? '.desc' : '.asc') + (o.nullsFirst ? '.nullsfirst' : '.nullslast')); return this; }
  eq(c, v) { this.p.append(c, 'eq.' + v); return this; }
  insert(o) { this.m = 'POST'; this.b = o; return this; }
  upsert(o) { this.m = 'POST'; this.b = o; this.pf = 'resolution=merge-duplicates'; return this; }
  update(o) { this.m = 'PATCH'; this.b = o; return this; }
  delete() { this.m = 'DELETE'; return this; }
  then(res, rej) { return this.run().then(res, rej); }
  async run() {
    try {
      const mut = this.m !== 'GET', h = { apikey: KEY, Authorization: 'Bearer ' + await tok(), 'Content-Type': 'application/json' };
      const pf = [this.pf, mut ? 'return=minimal' : ''].filter(Boolean).join(','); if (pf) h.Prefer = pf;
      const r = await fetch(API + '/rest/v1/' + this.t + '?' + this.p, { method: this.m, headers: h, body: this.b ? JSON.stringify(this.b) : undefined });
      if (!r.ok) { const e = await r.json().catch(() => ({})); return { data: null, error: { message: e.message || r.statusText } }; }
      return { data: mut ? null : await r.json(), error: null };
    } catch (e) { return { data: null, error: { message: 'تعذّر الاتصال بقاعدة البيانات. (تأكد من الإنترنت)' } }; }
  }
}

const sb = {
  from: t => new Q(t),
  auth: {
    getSession: async () => ({ data: { session: AUTH.s } }),
    signInWithPassword: async ({ email, password }) => {
      try {
        const r = await fetch(API + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const j = await r.json();
        if (!r.ok) return { error: { message: j.error_description || 'بيانات الدخول غير صحيحة' } };
        j.expires_at = Math.floor(Date.now() / 1000) + j.expires_in; saveS(j); init(); return { error: null };
      } catch (e) { return { error: { message: 'تعذّر الاتصال' } }; }
    },
    signOut: async () => saveS(null),
    updateUser: async ({ password }) => {
      try {
        const r = await fetch(API + '/auth/v1/user', { method: 'PUT', headers: { apikey: KEY, Authorization: 'Bearer ' + await tok(), 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
        const j = await r.json().catch(() => ({}));
        return { error: r.ok ? null : { message: j.msg || 'تعذّر التحديث' } };
      } catch (e) { return { error: { message: 'تعذّر الاتصال' } }; }
    }
  }
};

const $ = id => document.getElementById(id);
const $app = $('app'), dlg = $('dlg');
const S = { me: null, members: [], meetings: [], tasks: [], done: [], props: [], votes: [], propsErr: false, view: 'board', filter: 'mine', meeting: '', col: 'todo', pf: 'open' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const same = (a, b) => String(a || '').toLowerCase() === String(b || '').toLowerCase();
const daysTo = d => Math.round((new Date(d) - new Date(today())) / 864e5);
const ST = { todo: 'للتنفيذ', doing: 'قيد العمل', done: 'منجزة' };
const ACT = { todo: [['doing', 'بدء التنفيذ'], ['done', 'إنجاز ✓']], doing: [['done', 'إنجاز ✓'], ['todo', 'إيقاف']], done: [['doing', 'إعادة فتح']] };
const ACT_ALL = { todo: [['done', 'إنجاز المهمة ✓']], done: [['todo', 'تراجع']] };
const PST = { open: 'قيد التصويت', accepted: 'مُعتمد', rejected: 'مرفوض', closed: 'مغلق' };
const isClosed = p => ['accepted', 'rejected', 'closed'].includes(p.status);

const nm = e => S.members.find(m => same(m.email, e))?.name || 'غير مُسند';
const isAdmin = () => S.me && S.me.role === 'admin';
const canDel = t => isAdmin() || (S.me && same(t.created_by, S.me.email));
const mine = t => t.for_all || (S.me && same(t.assignee_email, S.me.email));
const doneBy = t => S.done.filter(d => d.task_id === t.id);
const eff = t => t.for_all ? (S.me && doneBy(t).some(d => same(d.email, S.me.email)) ? 'done' : 'todo') : t.status;
const run = async p => { const { error } = await p; if (error) alert('خطأ: ' + error.message); load(); };

async function init() {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session || !session.user || !session.user.email) {
      saveS(null);
      return loginView();
    }
    const email = session.user.email;
    
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.email === email) { Object.assign(S, c.s); render(); } } catch (e) {}

    const { data: members, error } = await sb.from('members').select('*');
    if (error) return showErrorBox('تعذر جلب الأعضاء: ' + error.message); 
    
    const me = members.find(m => same(m.email, email));
    if (!members.length || !me) { 
        saveS(null); 
        $app.innerHTML = '<div class="card" id="login">حسابك غير مرتبط بالفريق.<br><br><button class="p" onclick="location.reload()">رجوع</button></div>'; 
        return; 
    }
    
    S.members = members; S.me = me;
    await load();
  } catch (err) { showErrorBox(err.message); }
}

async function load() {
  const [m, t, p, v, d] = await Promise.all([
    sb.from('meetings').select('*').order('held_on', { ascending: false }),
    sb.from('tasks').select('*').order('due_on', { ascending: true, nullsFirst: false }),
    sb.from('proposals').select('*').order('created_at', { ascending: false }),
    sb.from('votes').select('*'),
    sb.from('task_done').select('*')
  ]);
  
  if (!m.error) S.meetings = m.data || [];
  if (!t.error) S.tasks = t.data || [];
  if (!d.error) S.done = d.data || [];
  S.propsErr = !!(p.error || v.error);
  if (!p.error) S.props = p.data || [];
  if (!v.error) S.votes = v.data || [];
  
  if (!m.error && !t.error && S.me) try { localStorage.setItem(CACHE_KEY, JSON.stringify({ email: S.me.email, s: { me: S.me, members: S.members, meetings: S.meetings, tasks: S.tasks, done: S.done, props: S.props, votes: S.votes } })); } catch (e) {}
  render();
}

function loginView() {
  $app.innerHTML = '<div class="card" id="login"><h1>مهام الفريق</h1><p class="m">سجّل الدخول للمتابعة</p>' +
  '<div class="row"><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr" style="width:100%"></div>' +
  '<div class="row" style="margin-top:12px"><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" style="width:100%"></div>' +
  '<button class="p" id="go" style="width:100%;margin-top:16px;padding:12px">تسجيل الدخول</button><p class="m" id="msg" style="margin-top:12px;color:var(--late)"></p></div>';
  
  const doLogin = async () => {
    $('msg').textContent = 'جارٍ الدخول...'; $('msg').style.color = 'inherit';
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value.trim(), password: $('pw').value });
    if(error){ $('msg').textContent = error.message; $('msg').style.color = 'var(--late)'; }
  };
  $('go').onclick = doLogin;
  $('pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
}
const logout = async () => { await sb.auth.signOut(); localStorage.clear(); location.reload(); };

function render() {
  if (!S.me) return;
  const props = S.props || [];
  const openProps = props.filter(p => !isClosed(p)).length;
  const badge = openProps ? '<span class="n">' + openProps + '</span>' : '';
  
  $app.innerHTML = '<div class="top"><h1>مدير المهام</h1><div class="row s"><span class="chip" style="font-size:14px">👤 ' + esc(S.me.name) + '</span><button id="rf" class="s">🔄 تحديث</button></div></div>' +
  '<div class="nav">' +
    '<button data-nv="board" class="' + (S.view === 'board' ? 'on' : '') + '">المهام والمشاريع</button>' +
    '<button data-nv="props" class="' + (S.view === 'props' ? 'on' : '') + '">القرارات والتصويت' + badge + '</button>' +
    '<button data-nv="set" class="' + (S.view === 'set' ? 'on' : '') + '">الإعدادات</button>' +
  '</div>' +
  (S.view === 'board' ? boardView() : S.view === 'props' ? propsView() : settingsView());
  
  $('rf').onclick = () => { $('rf').textContent = '⏳'; load(); };
  document.querySelectorAll('[data-nv]').forEach(b => b.onclick = () => { S.view = b.dataset.nv; render(); });
  if (S.view === 'board') bindBoard(); else if (S.view === 'props') bindProps(); else bindSettings();
}

function renderNotesAndWorkflow(notesStr) {
    if (!notesStr) return '';
    const lines = notesStr.split('\n');
    let mainNotes = [];
    let wfHistory = [];
    lines.forEach(l => {
        if(l.startsWith('[WF_HANDOFF]')) {
            let p = l.replace('[WF_HANDOFF]', '').split('||');
            wfHistory.push('<div class="wf-item"><div class="wf-meta">🔄 <b>' + esc(p[0]) + '</b> أحالها إلى <b>' + esc(p[1]) + '</b> <span dir="ltr">(' + esc(p[2]) + ')</span></div><div class="wf-msg">' + esc(p[3]||'') + '</div></div>');
        } else {
            mainNotes.push(l);
        }
    });
    let html = '';
    let mainTxt = mainNotes.join('\n').trim();
    if(mainTxt) html += '<div class="nt">' + esc(mainTxt) + '</div>';
    if(wfHistory.length > 0) html += '<div class="wf-list">' + wfHistory.join('') + '</div>';
    return html;
}

function dueInfo(t) {
  if (!t.due_on) return null;
  if (eff(t) === 'done') return { c: '', t: t.due_on };
  if (t.due_on < today()) return { c: 'late', t: '⚠️ متأخرة (' + t.due_on + ')' };
  const d = daysTo(t.due_on);
  return d <= 1 ? { c: 'soon', t: d ? '⏱️ غداً' : '🔥 اليوم' } : { c: '', t: '📅 ' + t.due_on };
}

function card(t) {
  const st = eff(t), d = dueInfo(t), mt = S.meetings.find(m => m.id === t.meeting_id);
  const acts = (t.for_all ? ACT_ALL : ACT)[st];
  const dn = doneBy(t);
  
  let waBtn = '';
  if (!t.for_all && t.assignee_email && S.me && t.assignee_email) {
    const msg = 'مرحباً ' + nm(t.assignee_email) + '،\nتذكير بمهمة: *' + t.title + '*\n' + (t.due_on ? 'تاريخ الاستحقاق: ' + t.due_on : '') + '\nنرجو المتابعة. 🚀';
    waBtn = '<a href="https://wa.me/?text=' + encodeURIComponent(msg) + '" target="_blank" class="wa-btn" title="تذكير عبر الواتساب">💬</a>';
  }

  let actsHtml = acts.map(([k, l]) => '<button data-mv="' + t.id + '" data-to="' + k + '">' + l + '</button>').join('');
  let handoffBtn = (!t.for_all && st !== 'done') ? '<button class="s" data-hf="' + t.id + '" style="background:var(--accsoft);color:var(--acc)">إحالة 🔄</button>' : '';

  let metaAll = t.for_all 
    ? '<span class="chip all" title="' + esc(dn.map(x => nm(x.email)).join('\n')) + '">👥 فريق (' + dn.length + '/' + S.members.length + ')</span>' 
    : '<span class="chip" style="font-weight:700">👤 ' + esc(nm(t.assignee_email)) + '</span>';

  let metaD = d ? '<span class="chip ' + d.c + '">' + esc(d.t) + '</span>' : '';
  let metaMt = mt ? '<span class="chip">📌 ' + esc(mt.title) + '</span>' : '';

  return '<div class="tk ' + st + '" draggable="true" data-id="' + t.id + '">' +
    '<div class="tt">' + esc(t.title) + '</div>' +
    renderNotesAndWorkflow(t.notes) +
    '<div class="meta" style="align-items:center;">' + metaAll + metaD + metaMt + waBtn + '</div>' +
    '<div class="acts">' + actsHtml + ' ' + handoffBtn + '</div>' +
  '</div>';
}

function boardView() {
  const all = S.tasks.filter(t => (!S.meeting || t.meeting_id === S.meeting) && (S.filter === 'all' || mine(t)));
  const open = all.filter(t => eff(t) !== 'done');
  const late = open.filter(t => t.due_on && t.due_on < today()).length;
  const soon = open.filter(t => t.due_on && t.due_on >= today() && daysTo(t.due_on) <= 1).length;
  
  const cols = Object.keys(ST).map(k => {
    const items = all.filter(t => eff(t) === k);
    return '<div class="col ' + (S.col === k ? 'on' : '') + '" data-st="' + k + '">' +
      '<div class="ch"><span>' + ST[k] + '</span><i>' + items.length + '</i></div>' +
      (items.length ? items.map(card).join('') : '<div class="empty">لا يوجد مهام</div>') +
    '</div>';
  }).join('');
  
  let mtOpts = '<option value="">كل المشاريع/الاجتماعات</option>' + S.meetings.map(m => '<option value="' + m.id + '" ' + (S.meeting === m.id ? 'selected' : '') + '>' + esc(m.title) + '</option>').join('');
  let adminBtn = isAdmin() ? '<button class="s" id="nmt" style="background:transparent;border-color:var(--mute)">+ قسم/اجتماع</button>' : '';
  let cTabs = Object.keys(ST).map(k => '<button data-c="' + k + '" class="' + (S.col === k ? 'on' : '') + '">' + ST[k] + ' (' + all.filter(t => eff(t) === k).length + ')</button>').join('');

  return '<div class="stats">' +
    '<div class="stat"><b>' + open.length + '</b><span>قيد العمل</span></div>' +
    '<div class="stat late"><b>' + late + '</b><span>متأخرة</span></div>' +
    '<div class="stat soon"><b>' + soon + '</b><span>اليوم/غداً</span></div>' +
  '</div>' +
  '<div class="tools">' +
    '<div class="seg"><button data-f="mine" class="' + (S.filter === 'mine' ? 'on' : '') + '">مهامي فقط</button><button data-f="all" class="' + (S.filter === 'all' ? 'on' : '') + '">كل الفريق</button></div>' +
    '<select id="fm" style="border-radius:6px">' + mtOpts + '</select>' +
    '<span class="sp"></span>' +
    adminBtn + '<button class="p s" id="nt">➕ إضافة مهمة</button>' +
  '</div>' +
  '<div class="ctabs">' + cTabs + '</div>' +
  '<div class="board">' + cols + '</div>';
}

function bindBoard() {
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.filter = b.dataset.f; render(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.col = b.dataset.c; render(); });
  $('fm').onchange = e => { S.meeting = e.target.value; render(); };
  $('nt').onclick = () => taskDialog(null);
  if ($('nmt')) $('nmt').onclick = () => { const t = prompt('اسم القسم/الاجتماع الجديد'); if (t && t.trim()) run(sb.from('meetings').insert({ title: t.trim() })); };
  
  document.querySelectorAll('[data-mv]').forEach(b => b.onclick = e => { e.stopPropagation(); moveTask(b.dataset.mv, b.dataset.to); });
  document.querySelectorAll('[data-hf]').forEach(b => { b.onclick = e => { e.stopPropagation(); handoffDialog(b.dataset.hf); }; });

  document.querySelectorAll('.tk').forEach(el => {
    el.onclick = () => taskDialog(S.tasks.find(t => t.id === el.dataset.id));
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.id); e.dataTransfer.effectAllowed = 'move'; el.classList.add('drag'); };
    el.ondragend = () => el.classList.remove('drag');
  });
  document.querySelectorAll('.col').forEach(c => {
    c.ondragover = e => { e.preventDefault(); c.classList.add('over'); };
    c.ondragleave = () => c.classList.remove('over');
    c.ondrop = e => { e.preventDefault(); c.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) moveTask(id, c.dataset.st); };
  });
}

function handoffDialog(tId) {
    const t = S.tasks.find(x => x.id === tId);
    if(!t) return;
    let opts = '<option value="">-- اختر الزميل --</option>' + S.members.filter(m => !same(m.email, t.assignee_email)).map(m => '<option value="' + esc(m.email) + '">' + esc(m.name) + '</option>').join('');
    
    dlg.innerHTML = '<h2>إحالة المهمة (Workflow)</h2>' +
    '<div style="background:var(--col);padding:10px;border-radius:8px;margin-bottom:16px;font-weight:600">' + esc(t.title) + '</div>' +
    '<label>إحالة إلى الزميل:<select id="hf_to">' + opts + '</select></label>' +
    '<label>رسالة التوجيه/المطلوب:<textarea id="hf_msg" rows="3" placeholder="اكتب ملاحظاتك ليكمل عليها..."></textarea></label>' +
    '<div class="row dact"><button id="hf_cx" class="s">إلغاء</button><button class="p" id="hf_sv">إحالة المهمة الآن</button></div>';
    
    $('hf_cx').onclick = () => dlg.close();
    $('hf_sv').onclick = async () => {
        const to = $('hf_to').value;
        if(!to) return alert('الرجاء اختيار زميل لإحالة المهمة إليه.');
        const msg = $('hf_msg').value.trim();
        if(!msg) return alert('الرجاء كتابة رسالة توجيه للزميل.');
        
        const noteAppend = '\n[WF_HANDOFF]' + S.me.name + '||' + nm(to) + '||' + today() + '||' + msg;
        const newNotes = (t.notes || '') + noteAppend;
        
        $('hf_sv').disabled = true; $('hf_sv').textContent = 'جاري الإحالة...';
        const { error } = await sb.from('tasks').update({ assignee_email: to, notes: newNotes, status: 'todo' }).eq('id', t.id);
        if(error) { alert('خطأ: ' + error.message); $('hf_sv').disabled = false; return; }
        
        // إشعار السيرفر بوجود مهمة جديدة أُحيلت لشخص
        fetch('/api/notify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: t.title, assignee_email: to, for_all: false, sender_name: S.me.name })
        }).catch(e => console.error(e));

        dlg.close(); load();
    };
    dlg.showModal();
}

async function moveTask(id, to) {
  const t = S.tasks.find(x => x.id === id);
  if (!t || eff(t) === to || !S.me) return;
  S.col = to;
  if (t.for_all) {
    if (to === 'doing') return;
    if (to === 'done') {
      S.done.push({ task_id: id, email: S.me.email }); render();
      run(sb.from('task_done').upsert({ task_id: id, email: S.me.email }));
    } else {
      S.done = S.done.filter(d => !(d.task_id === id && same(d.email, S.me.email))); render();
      run(sb.from('task_done').delete().eq('task_id', id).eq('email', S.me.email));
    }
    return;
  }
  const prev = t.status; t.status = to; render();
  const { error } = await sb.from('tasks').update({ status: to }).eq('id', id);
  if (error) { t.status = prev; alert('خطأ: ' + error.message); load(); }
}

function taskDialog(t, pre = {}) {
  const x = t || pre, edit = !!t;
  const asVal = x.for_all ? '__all' : (x.assignee_email || (S.me ? S.me.email : ''));
  
  let asOpts = '<option value="__all" ' + (asVal === '__all' ? 'selected' : '') + '>👥 مهمة جماعية للكل</option>' +
               '<option value="" ' + (asVal === '' ? 'selected' : '') + '>غير مُسند</option>' +
               S.members.map(m => '<option value="' + esc(m.email) + '" ' + (same(m.email, asVal) ? 'selected' : '') + '>' + esc(m.name) + '</option>').join('');
               
  let mtOpts = '<option value="">بدون ارتباط</option>' + S.meetings.map(m => '<option value="' + m.id + '" ' + (x.meeting_id === m.id ? 'selected' : '') + '>' + esc(m.title) + '</option>').join('');
  let stOpts = Object.entries(ST).map(([k, v]) => '<option value="' + k + '" ' + ((x.status || 'todo') === k ? 'selected' : '') + '>' + v + '</option>').join('');

  let dlBtn = edit && canDel(t) ? '<button class="dng s" id="f_dl" style="margin-inline-end:auto">حذف</button>' : '<span></span>';

  dlg.innerHTML = '<h2>' + (edit ? 'تعديل المهمة' : 'مهمة جديدة') + '</h2>' +
  '<label>العنوان<input id="f_ti" value="' + esc(x.title || '') + '" placeholder="ما هو المطلوب إنجازه؟"></label>' +
  '<label>تفاصيل وروابط (اختياري)<textarea id="f_no" rows="3">' + esc(x.notes || '') + '</textarea></label>' +
  '<div class="row">' +
    '<label>المسؤول الأول عن التنفيذ<select id="f_as">' + asOpts + '</select></label>' +
    '<label>تاريخ الاستحقاق<input id="f_du" type="date" value="' + esc(x.due_on || '') + '"></label>' +
  '</div>' +
  '<div class="row" style="margin-top:10px">' +
    '<label>الارتباط (قسم/مشروع)<select id="f_mt">' + mtOpts + '</select></label>' +
    '<label id="f_stw">الحالة<select id="f_st">' + stOpts + '</select></label>' +
  '</div>' +
  '<p class="m" id="f_hint" style="margin:12px 0 0;padding:10px;background:var(--accsoft);color:var(--acc);border-radius:8px">ℹ️ <b>مهمة للكل:</b> تظهر لجميع الأعضاء، وكل عضو يعتمد إنجازها لنفسه بشكل منفصل.</p>' +
  '<div class="row dact">' + dlBtn + '<button id="f_cx" class="s">إلغاء</button><button class="p s" id="f_sv">حفظ</button></div>';
  
  const sync = () => { const a = $('f_as').value === '__all'; $('f_stw').style.display = a ? 'none' : ''; $('f_hint').style.display = a ? '' : 'none'; };
  $('f_as').onchange = sync; sync();
  $('f_cx').onclick = () => dlg.close();
  $('f_sv').onclick = async () => {
    const title = $('f_ti').value.trim(); if (!title) return $('f_ti').focus();
    const all = $('f_as').value === '__all';
    const assignee = $('f_as').value;
    const row = { title, notes: $('f_no').value.trim() || null, for_all: all, assignee_email: all ? null : (assignee || null), due_on: $('f_du').value || null, meeting_id: $('f_mt').value || null, status: all ? 'todo' : $('f_st').value };
    if (!edit) row.created_by = S.me.email;
    
    $('f_sv').disabled = true; $('f_sv').textContent = '...';
    const { error } = edit ? await sb.from('tasks').update(row).eq('id', t.id) : await sb.from('tasks').insert(row);
    if (error) { alert('خطأ: ' + error.message); $('f_sv').disabled = false; $('f_sv').textContent = 'حفظ'; return; }
    
    // إرسال إشعار فوري عند الإضافة (ليست تعديلاً)
    if (!edit && (all || assignee)) {
        fetch('/api/notify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: row.title, assignee_email: row.assignee_email, for_all: row.for_all, sender_name: S.me.name })
        }).catch(e => console.error(e));
    }

    dlg.close(); load();
  };
  if (edit && canDel(t)) $('f_dl').onclick = () => { if (confirm('هل أنت متأكد من حذف المهمة؟')) { dlg.close(); run(sb.from('tasks').delete().eq('id', t.id)); } };
  dlg.showModal(); if (!edit) $('f_ti').focus();
}
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

function parseOptions(p) {
  let arr = ['موافق', 'معارض'];
  if (p && p.options) {
      if (Array.isArray(p.options)) arr = p.options;
      else try { const j = JSON.parse(p.options); if(Array.isArray(j)) arr = j; } catch(e){}
  }
  let isMulti = false;
  if(arr[0] === '__MULTI__') { isMulti = true; arr = arr.slice(1); }
  return { opts: arr, isMulti };
}

function propCard(p) {
  const parsed = parseOptions(p);
  const opts = parsed.opts;
  const isMulti = parsed.isMulti;
  
  const vts = (S.votes || []).filter(x => x.proposal_id === p.id);
  const myVote = S.me ? vts.find(x => same(x.email, S.me.email)) : null;
  
  let optCounts = opts.map(()=>0);
  let optVoters = opts.map(()=>[]);
  
  vts.forEach(v => {
      let nStr = v.note || '';
      let selections = [];
      if(v.option_idx === -1 && nStr.startsWith('MULTI:')) {
          let parts = nStr.substring(6).split('||');
          selections = parts[0].split(',').map(Number);
          v.actualNote = parts[1] || '';
      } else {
          selections = [v.option_idx != null ? v.option_idx : (v.value===1?0:1)];
          v.actualNote = nStr;
      }
      selections.forEach(idx => {
          if(optCounts[idx] !== undefined) {
              optCounts[idx]++;
              optVoters[idx].push(v);
          }
      });
  });

  const totalVotes = vts.length;
  const can = S.me && (same(p.author_email, S.me.email) || isAdmin());
  const open = !isClosed(p);

  let res = opts.map((opt, i) => {
    let count = optCounts[i];
    let w = totalVotes ? ((count / totalVotes) * 100).toFixed(0) : 0;
    
    let vlist = '';
    if (count > 0) {
      let items = optVoters[i].map(x => '<b>' + esc(nm(x.email)) + '</b>' + (x.actualNote ? ' <span style="color:var(--mute)">(' + esc(x.actualNote) + ')</span>' : '')).join('<br>');
      vlist = '<div class="voters-box">' + items + '</div>';
    }
    
    return '<div style="margin-bottom:14px">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px"><span>' + esc(opt) + '</span><span>' + count + ' صوت (' + w + '%)</span></div>' +
      '<div class="tally"><i style="width:' + w + '%;background:var(--acc)"></i></div>' +
      vlist +
    '</div>';
  }).join('');

  let act = '';
  if (open) {
    let mySelections = [];
    let myNote = '';
    if(myVote) {
        if(myVote.option_idx === -1 && (myVote.note||'').startsWith('MULTI:')) {
            let parts = myVote.note.substring(6).split('||');
            mySelections = parts[0].split(',').map(Number);
            myNote = parts[1] || '';
        } else {
            mySelections = [myVote.option_idx != null ? myVote.option_idx : (myVote.value===1?0:1)];
            myNote = myVote.note || '';
        }
    }
    
    let inputUI = '';
    if (isMulti) {
        inputUI = '<div class="multi-options" id="v_m_' + p.id + '">' + opts.map((o, i) => 
            '<label><input type="checkbox" value="' + i + '" ' + (mySelections.includes(i) ? 'checked' : '') + '> ' + esc(o) + '</label>'
        ).join('') + '</div>';
    } else {
        inputUI = '<select id="v_s_' + p.id + '" style="width:100%;margin-bottom:8px"><option value="">-- اختر أحد الخيارات --</option>' + 
        opts.map((o, i) => '<option value="' + i + '" ' + (mySelections.includes(i) ? 'selected' : '') + '>' + esc(o) + '</option>').join('') + 
        '</select>';
    }
    
    let btnText = myVote ? 'تحديث التصويت' : 'إرسال التصويت';
    act = '<div style="margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);">' +
      '<h3 style="font-size:14px;margin:0 0 10px;color:var(--acc)">صوّت الآن:</h3>' +
      inputUI +
      '<input id="v_n_' + p.id + '" placeholder="اكتب ملاحظة ليروها الجميع (اختياري)..." value="' + esc(myNote) + '" style="width:100%;margin-top:8px">' +
      '<button class="p" data-cast="' + p.id + '" data-ismulti="' + isMulti + '" style="width:100%;margin-top:12px">' + btnText + '</button>' +
    '</div>';
  }
  
  let actionBtns = can ? (open ? '<button data-ps="' + p.id + '" data-to="accepted">اعتماد</button><button data-ps="' + p.id + '" data-to="rejected">رفض</button>' : '<button data-ps="' + p.id + '" data-to="open">إعادة فتح</button>') + '<button class="dng" data-pdel="' + p.id + '">حذف</button>' : '';
  let detHtml = p.details ? '<div class="det">' + esc(p.details) + '</div>' : '';

  return '<div class="card pr">' +
    '<div class="bar"><span class="ttl">' + esc(p.title) + '</span><span class="chip ' + (p.status === 'accepted' ? 'ok' : p.status === 'rejected' ? 'late' : 'all') + '">' + esc(PST[p.status] || p.status) + '</span></div>' +
    detHtml +
    '<div class="m">بواسطة ' + esc(nm(p.author_email)) + ' · ' + esc((p.created_at || '').slice(0, 10)) + '</div>' +
    '<div style="margin-top:16px;background:var(--col);padding:16px;border-radius:12px">' + res + '</div>' +
    act +
    '<div class="pa">' +
      '<button data-totask="' + p.id + '">تحويل إلى مهمة</button>' +
      actionBtns +
    '</div>' +
  '</div>';
}

function propsView() {
  if (S.propsErr) return '<div class="card"><b style="color:var(--late)">عذراً، يوجد خطأ في الاتصال بجداول التصويت.</b></div>';
  const list = S.props.filter(p => S.pf === 'open' ? !isClosed(p) : isClosed(p));
  
  let listHtml = list.length ? list.map(propCard).join('') : '<div class="card empty">لا توجد مقترحات في هذه القائمة.</div>';
  
  return '<div class="tools"><div class="seg"><button data-pf="open" class="' + (S.pf === 'open' ? 'on' : '') + '">قيد التصويت</button><button data-pf="closed" class="' + (S.pf === 'closed' ? 'on' : '') + '">المغلقة</button></div><span class="sp"></span><button class="p" id="np">➕ مقترح/تصويت جديد</button></div>' +
  listHtml;
}

function bindProps() {
  if (S.propsErr) return;
  document.querySelectorAll('[data-pf]').forEach(b => b.onclick = () => { S.pf = b.dataset.pf; render(); });
  $('np').onclick = propDialog;
  
  document.querySelectorAll('[data-cast]').forEach(btn => {
    btn.onclick = async () => {
      const pid = btn.dataset.cast;
      const isMulti = btn.dataset.ismulti === 'true';
      let selectedIdx = -1;
      let finalNote = '';
      let userNote = $('v_n_' + pid).value.trim();
      
      if (isMulti) {
          let checks = document.querySelectorAll('#v_m_' + pid + ' input[type="checkbox"]:checked');
          if(checks.length === 0) return alert('الرجاء اختيار خيار واحد على الأقل.');
          let vals = Array.from(checks).map(c => c.value);
          selectedIdx = -1;
          finalNote = 'MULTI:' + vals.join(',') + '||' + userNote;
      } else {
          let sel = $('v_s_' + pid).value;
          if(sel === '') return alert('الرجاء اختيار خيار.');
          selectedIdx = parseInt(sel);
          finalNote = userNote;
      }
      
      btn.textContent = 'جاري الإرسال...'; btn.disabled = true;
      const { error } = await sb.from('votes').upsert({ proposal_id: pid, email: S.me.email, option_idx: selectedIdx, value: (selectedIdx === 0 ? 1 : -1), note: finalNote || null });
      if (error) alert('خطأ: ' + error.message);
      load();
    };
  });
  
  document.querySelectorAll('[data-ps]').forEach(b => b.onclick = () => run(sb.from('proposals').update({ status: b.dataset.to }).eq('id', b.dataset.ps)));
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = () => { if (confirm('حذف نهائي للمقترح وأصواته؟')) run(sb.from('proposals').delete().eq('id', b.dataset.pdel)); });
  document.querySelectorAll('[data-totask]').forEach(b => b.onclick = () => { const p = S.props.find(x => x.id === b.dataset.totask); taskDialog(null, { title: p.title, notes: p.details || '', for_all: true }); });
}

function propDialog() {
  dlg.innerHTML = '<h2>طرح تصويت/مقترح جديد</h2>' +
  '<label>عنوان المقترح<input id="p_ti" placeholder="مثلاً: تغيير موعد الاجتماع"></label>' +
  '<label>التفاصيل والمبررات<textarea id="p_de" rows="2"></textarea></label>' +
  '<label>خيارات التصويت (اكتب كل خيار في سطر مستقل)<textarea id="p_op" rows="3" placeholder="الخيار الأول\nالخيار الثاني"></textarea></label>' +
  '<label style="display:flex;align-items:center;gap:8px;font-weight:600;margin-top:12px"><input type="checkbox" id="p_multi" style="width:18px;height:18px;margin:0"> السماح باختيار أكثر من خيار</label>' +
  '<div class="row dact"><button id="p_cx" class="s">إلغاء</button><button class="p s" id="p_sv">نشر للتصويت</button></div>';
  
  $('p_cx').onclick = () => dlg.close();
  $('p_sv').onclick = async () => {
    const title = $('p_ti').value.trim(); if (!title) return $('p_ti').focus();
    let rawOpts = $('p_op').value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
    if (rawOpts.length === 0) rawOpts = ['موافق', 'غير موافق'];
    
    if($('p_multi').checked) rawOpts.unshift('__MULTI__');
    
    $('p_sv').disabled = true; $('p_sv').textContent = '...';
    const { error } = await sb.from('proposals').insert({ title, details: $('p_de').value.trim() || null, author_email: S.me.email, status: 'open', options: JSON.stringify(rawOpts) });
    if (error) return alert('خطأ: ' + error.message);
    dlg.close(); load();
  };
  dlg.showModal(); $('p_ti').focus();
}

/* ---------- الإعدادات ---------- */
function settingsView() {
  let adminHtml = '';
  if (isAdmin()) {
    let memList = S.members.map(m => {
        let rmBtn = (S.me && same(m.email, S.me.email)) ? '' : '<button class="dng s" data-rm="' + esc(m.email) + '">إزالة</button>';
        return '<div class="bar" style="background:var(--col);padding:8px 12px;border-radius:8px;margin-bottom:6px"><div><b>' + esc(m.name) + '</b> <span class="m" dir="ltr">(' + esc(m.email) + ')</span></div>' + rmBtn + '</div>';
    }).join('');
    
    // قائمة الموظفين للإشعار المخصص
    let optMembers = '<option value="">-- اختر الموظف --</option>' + S.members.map(m => '<option value="' + esc(m.email) + '">' + esc(m.name) + '</option>').join('');

    adminHtml = '<div class="card" style="border-color:var(--accsoft)"><h2>👑 إدارة الأعضاء والتنبيهات</h2>' +
      '<button class="p" id="admin_remind" style="width:100%;margin-bottom:16px;background:var(--soon);border-color:var(--soon)">إرسال تذكير شامل للفريق 🔔</button>' +
      '<h3 style="font-size:14px;margin-top:16px;color:var(--acc)">إرسال إشعار مخصص لموظف:</h3>' +
      '<div class="row" style="margin-bottom:16px"><select id="ping_to">' + optMembers + '</select><input id="ping_msg" placeholder="اكتب رسالة التنبيه..."><button class="p s" id="send_ping">إرسال 🔔</button></div>' +
      '<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">' +
      memList + 
      '<h3 style="font-size:14px;margin-top:16px">إضافة عضو:</h3><div class="row"><input id="nn" placeholder="اسم العضو"><input id="ne" dir="ltr" placeholder="البريد الإلكتروني"><button class="p s" id="addm">إضافة للفريق</button></div></div>';
  }

  return '<div class="card" style="border-color:var(--oksoft)">' +
    '<h2>🔔 إشعارات الجوال للأعضاء</h2>' +
    '<div class="row"><button class="p s" id="push" style="background:var(--ok);border-color:var(--ok)">1. تفعيل الإشعارات أولاً</button></div>' +
    '<p class="m" id="pm" style="margin-top:10px;font-weight:600"></p>' +
    '<div class="row" style="margin-top:10px"><button class="s" id="test_push" style="background:var(--soon);border-color:var(--soon);color:#fff">2. تجربة الإشعار في جوالي الآن 🔔</button></div>' +
  '</div>' +
  '<div class="card"><h2>تغيير كلمة المرور</h2><div class="row"><input id="np" type="password" dir="ltr" placeholder="6 أحرف على الأقل"><button class="s" id="svp">حفظ التغيير</button></div></div>' +
  adminHtml +
  '<div class="card" style="background:var(--latesoft);border-color:var(--latesoft);text-align:center"><button class="dng" id="out" style="background:transparent;width:100%;padding:10px">تسجيل الخروج الآمن</button></div>';
}

function bindSettings() {
  $('out').onclick = logout;

  // إرسال تذكير شامل
  if ($('admin_remind')) {
    $('admin_remind').onclick = async () => {
        $('admin_remind').textContent = 'جاري إرسال التذكيرات...';
        try {
            await fetch('/api/remind');
            alert('تم إرسال تذكير بالمهام المتأخرة لجميع أعضاء الفريق!');
        } catch(e) { alert('تأكد من رفع مجلد api إلى Vercel!'); }
        $('admin_remind').textContent = 'إرسال تذكير شامل للفريق 🔔';
    };
  }

  // إرسال إشعار مخصص لموظف
  if ($('send_ping')) {
      $('send_ping').onclick = async () => {
          const to = $('ping_to').value;
          const msg = $('ping_msg').value.trim();
          if (!to) return alert('الرجاء اختيار الموظف أولاً.');
          if (!msg) return alert('الرجاء كتابة رسالة التنبيه.');
          
          $('send_ping').disabled = true; $('send_ping').textContent = '...';
          try {
              await fetch('/api/notify', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ title: 'تنبيه إداري 🔔', body: msg, assignee_email: to, for_all: false, sender_name: S.me.name, is_custom: true })
              });
              alert('تم إرسال التنبيه للموظف بنجاح.');
              $('ping_msg').value = '';
          } catch(e) { alert('تأكد من رفع مجلد api إلى Vercel!'); }
          $('send_ping').disabled = false; $('send_ping').textContent = 'إرسال 🔔';
      };
  }
  
$('push').onclick = async () => {
    const pm = $('pm');
    pm.textContent = 'جاري مسح الذاكرة العميقة والتفعيل...';
    try {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return pm.textContent = 'جهازك لا يدعم الإشعارات.';
      if (await Notification.requestPermission() !== 'granted') return pm.textContent = 'لم تُمنح الصلاحية.';
      
      const reg = await navigator.serviceWorker.ready;
      
      // 1. الهجوم الأول: البحث عن أي اشتراك قديم وتدميره برمجياً
      let existingSub = await reg.pushManager.getSubscription();
      if (existingSub) {
          await existingSub.unsubscribe(); // مسح الاشتراك القديم من المتصفح غصباً عنه
      }

      // 2. الهجوم الثاني: تنظيف قاعدة البيانات برمجياً من أي بقايا لإيميلك
      await sb.from('push_subs').delete().eq('email', S.me.email);

      // 3. البناء الجديد: إنشاء اشتراك نظيف بالمفتاح الجديد
      const key = Uint8Array.from(atob(VAPID_PUBLIC.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key });
      
      // 4. الحفظ في قاعدة البيانات
      const { error } = await sb.from('push_subs').upsert({ endpoint: sub.endpoint, email: S.me.email, sub: sub.toJSON() });
      
      pm.innerHTML = error ? 'خطأ: ' + error.message : '<span style="color:var(--ok)">✅ تم قهر المتصفح وتفعيل الإشعارات بنجاح!</span>';
    } catch (e) { pm.textContent = 'خطأ: ' + e.message; }
  };

  $('test_push').onclick = async () => {
    if (!('serviceWorker' in navigator)) return alert('المتصفح لا يدعم الإشعارات.');
    if (Notification.permission !== 'granted') return alert('يجب تفعيل الإشعارات أولاً.');
    const reg = await navigator.serviceWorker.ready;
    alert('سيصلك الإشعار خلال 3 ثوانٍ.. اخرج من التطبيق الآن للشاشة الرئيسية لترى الإشعار.');
    setTimeout(() => {
      reg.showNotification('🔔 تذكير تجريبي', { body: 'هذا إشعار حقيقي! النظام يعمل بنجاح.', icon: '/icon-192.png', badge: '/icon-192.png', vibrate: [200, 100, 200] });
    }, 3000);
  };

  $('svp').onclick = async () => { 
    const v = $('np').value; if (v.length < 6) return alert('6 أحرف على الأقل'); 
    $('svp').textContent = '...';
    const { error } = await sb.auth.updateUser({ password: v }); 
    alert(error ? error.message : 'تم التغيير.'); $('np').value = ''; $('svp').textContent = 'حفظ التغيير';
  };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { if (confirm('إزالة العضو نهائياً؟')) run(sb.from('members').delete().eq('email', b.dataset.rm)); });
  if ($('addm')) $('addm').onclick = () => { const e = $('ne').value.trim(), n = $('nn').value.trim(); if (e && n) run(sb.from('members').insert({ email: e, name: n })); };
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.me && !dlg.open) load(); });
init();
</script>
